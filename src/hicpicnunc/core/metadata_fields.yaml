# EXIF fields copied into exported photos — the single source of truth.
# Use IFD:TagName (piexif names, e.g. Exif:DateTimeOriginal, 0th:Make).
# Override with EXIF_FIELDS_CONFIG=/path/to/file.yaml (same structure).

# Always exported when present, whatever the user picks in Settings.
always_kept:
  # Capture date, time zone and sub-seconds
  - "0th:DateTime"
  - "Exif:DateTimeOriginal"
  - "Exif:DateTimeDigitized"
  - "Exif:OffsetTime"
  - "Exif:OffsetTimeOriginal"
  - "Exif:OffsetTimeDigitized"
  - "Exif:SubSecTimeOriginal"
  # Dropping it makes photos display rotated
  - "0th:Orientation"

# Optional groups; each key is a toggle in Settings (on by default).
groups:
  camera_details:
    - "0th:Make"
    - "0th:Model"
    - "Exif:ExposureTime"
    - "Exif:FNumber"
    - "Exif:ISOSpeedRatings"
    - "Exif:FocalLength"
    - "Exif:LensModel"
    - "Exif:Flash"
    - "Exif:WhiteBalance"
    - "Exif:ExifVersion"
  gps_location:
    - "GPS:GPSLatitude"
    - "GPS:GPSLatitudeRef"
    - "GPS:GPSLongitude"
    - "GPS:GPSLongitudeRef"
    - "GPS:GPSAltitude"
    - "GPS:GPSAltitudeRef"

# If true, MakerNote is never embedded (safer for camera-specific blobs).
skip_makernote_embed: true
