name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR supersedes the previous run; runs on main always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # The minimum in required-version (pyproject.toml), so an old uv that breaks on uv.lock
          # fails here.
          resolution-strategy: lowest
      - name: Install locked development tools
        run: uv sync --group dev --locked
      - name: Run hooks (lint, format, types, lock file, workflow audit)
        env:
          # Enables zizmor's online audits, such as known-vulnerable actions and impostor commits.
          GH_TOKEN: ${{ github.token }}
        run: uv run --frozen prek run --all-files --show-diff-on-failure

  tests:
    name: tests (${{ matrix.os }}${{ matrix.python && format(', {0}', matrix.python) || '' }})
    strategy:
      fail-fast: false
      matrix:
        # Same platforms as the desktop releases, so OS-specific failures show up in PRs.
        os: [ubuntu-latest, windows-2022, macos-15]
        # Empty means .python-version and keeps the job names above, which are required checks.
        # As a matrix axis, it makes the entries below new jobs, not merged into ubuntu-latest.
        python: [""]
        # The other Python versions in the classifiers, on Ubuntu only.
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # The minimum in required-version (pyproject.toml), so an old uv that breaks on uv.lock
          # fails here.
          resolution-strategy: lowest
          python-version: ${{ matrix.python }}
      - name: Install locked development tools
        run: uv sync --group dev --locked
      - name: Test with coverage
        # Fails below fail_under in pyproject.toml.
        run: uv run --frozen pytest --cov
