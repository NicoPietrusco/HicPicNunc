name: Release desktop apps

# Called by release-please.yml once it has created the release. Run it by hand to build the
# apps without publishing them, or to attach them again to an existing release. PRs that can
# change the frozen app build and smoke-test it without publishing anything.
on:
  pull_request:
    paths:
      - uv.lock
      - pyproject.toml
      - packaging/**
      - scripts/smoke_test_bundle.py
      - .github/workflows/release.yml
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the apps to
        required: true
        type: string
    secrets:
      GOOGLE_OAUTH_CLIENT_JSON:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the apps to (leave empty to only build)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR supersedes the previous build; release builds always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS-arm64
            arch: arm64
          - os: macos-15-intel
            name: macOS-x64
            arch: x64
          - os: windows-2022
            name: Windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # A cache written by PR runs must never feed a release build.
          enable-cache: false
          # The minimum in required-version (pyproject.toml), as in quality.yml.
          resolution-strategy: lowest
      - name: Install locked build tools
        run: uv sync --group dev --locked
      - name: Check the tag matches the package version
        if: inputs.tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(uv run python -c 'from importlib.metadata import version; print(version("hicpicnunc"))')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${version} in pyproject.toml"
            exit 1
          fi
      - name: Run quality checks
        # On PRs, quality.yml already runs them.
        if: github.event_name != 'pull_request'
        run: |
          uv run ruff check src/ tests/
          uv run ty check src/ tests/
          uv run pytest
      - name: Add the release OAuth client
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_JSON: ${{ secrets.GOOGLE_OAUTH_CLIENT_JSON }}
        run: |
          test -n "$GOOGLE_OAUTH_CLIENT_JSON"
          mkdir -p credentials
          printf '%s' "$GOOGLE_OAUTH_CLIENT_JSON" > credentials/client_secrets.json
      - name: Add a placeholder OAuth client
        # PRs from forks and Dependabot can't read the secret, and the smoke test doesn't sign in.
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p credentials
          cat > credentials/client_secrets.json <<'JSON'
          {"installed": {"client_id": "placeholder.apps.googleusercontent.com", "client_secret": "placeholder",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth", "token_uri": "https://oauth2.googleapis.com/token",
            "redirect_uris": ["http://localhost"]}}
          JSON
      - name: Build application
        run: uv run pyinstaller --noconfirm --clean packaging/pyinstaller.spec
      - name: Smoke-test the bundle
        # Launches the real windowed app: catches crashes that only happen once frozen.
        run: uv run python scripts/smoke_test_bundle.py dist
      - name: Package macOS disk image
        if: runner.os == 'macOS'
        env:
          ARCH: ${{ matrix.arch }}
        run: hdiutil create -volname "Hic Pic Nunc" -srcfolder "dist/Hic Pic Nunc.app" -ov -format UDZO "dist/HicPicNunc-macOS-${ARCH}.dmg"
      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path 'dist\Hic Pic Nunc\*' -DestinationPath 'dist\HicPicNunc-Windows-x64.zip'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name != 'pull_request'
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.zip

  release:
    if: inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      # release-please creates the release, this job only attaches the apps to it.
      - name: Attach the apps to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "${TAG}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
