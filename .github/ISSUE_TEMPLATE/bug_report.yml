name: Bug report
description: Report a reproducible problem with Hic Pic Nunc.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Which version of Hic Pic Nunc are you using?
      placeholder: "e.g. v0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS and version.
      placeholder: "e.g. Windows 11 24H2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the steps that consistently reproduce the problem.
      placeholder: |
        1. Open Hic Pic Nunc
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Please include the relevant part of the log file, if available.
        The log file is located at logs/hicpicnunc.log.
      render: text
    validations:
      required: false
